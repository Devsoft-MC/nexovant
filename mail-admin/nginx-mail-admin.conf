# Include this inside the TLS server block for nexovantsolutions.com.
# Access is restricted to the existing WireGuard client plus HTTP Basic Auth.
location = /mail {
    return 301 https://nexovantsolutions.com/mail/;
}

location ^~ /mail/ {
    allow 10.77.0.1;
    deny all;

    auth_basic "Nexovant Mail Admin";
    auth_basic_user_file /etc/nginx/mail-admin.htpasswd;

    client_max_body_size 8k;
    limit_req zone=mail_admin burst=10 nodelay;

    proxy_pass http://127.0.0.1:4110/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Remote-User $remote_user;
    proxy_hide_header Server;
}
